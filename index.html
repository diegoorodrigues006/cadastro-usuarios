<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231877f2'/%3E%3Cpath d='M50 25a15 15 0 1 1 0 30 15 15 0 0 1 0-30zm0 38c16.5 0 30 9.8 30 22v3H20v-3c0-12.2 13.5-22 30-22z' fill='%23ffffff'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <button id="btnTema" class="btn-tema" title="Alternar Tema">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div id="alerta" class="alerta oculto">
        <span id="textoAlerta"></span>
    </div>

    <div class="header-titulo">
        <div class="logo-container">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="logo-svg">
                <rect width="100" height="100" rx="24" fill="var(--primary-color)"/>
                <path d="M50 25a15 15 0 1 1 0 30 15 15 0 0 1 0-30zm0 38c16.5 0 30 9.8 30 22v3H20v-3c0-12.2 13.5-22 30-22z" fill="#ffffff"/>
            </svg>
            <h1>Cadastro de Usuários</h1>
        </div>
    </div>

    <div class="container">
        <form id="formCadastro">
            <div class="input-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required>
            </div>
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>
            <!-- NOVO: Campo de Telefone -->
            <div class="input-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <div class="password-container">
                    <input type="password" id="senha" required minlength="6">
                    <button type="button" id="btnToggleSenha" class="btn-toggle-senha" title="Mostrar/Ocultar Senha">
                        <i class="fa-solid fa-eye" id="iconeOlho"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-acoes">
                <button type="submit" id="btnSalvar" class="btn-cadastrar">
                    <i class="fa-solid fa-plus"></i> Cadastrar Usuário
                </button>
                <button type="button" id="btnCancelar" class="btn-cancelar oculto">
                    Cancelar
                </button>
            </div>
        </form>
    </div>

    <div class="lista-container">
        <div class="lista-header">
            <h3>Usuários Cadastrados</h3>
            <span id="contador" class="badge">0</span>
        </div>

        <!-- NOVO: Barra de Pesquisa -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="inputPesquisa" placeholder="Pesquisar por nome ou e-mail...">
        </div>

        <div id="listaUsuarios" class="grid-usuarios"></div>
    </div>

    <script src="src/js/script.js"></script>
</body>
</html>
