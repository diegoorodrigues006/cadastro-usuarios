<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro</title>
    
    <!-- Fonte moderna do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link para o seu CSS -->
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <!-- Botão Dark Mode -->
    <button id="btnTema" class="btn-tema" title="Alternar Tema">
        <i class="fa-solid fa-moon"></i>
    </button>

    <!-- Alerta Visual Moderno -->
    <div id="alerta" class="alerta oculto">
        <span id="textoAlerta"></span>
    </div>

    <div class="header-titulo">
        <h1>Cadastro de Usuários</h1>
    </div>

    <div class="container">
        <form id="formCadastro">
            <div class="input-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required>
            </div>
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required minlength="6">
            </div>
            <button type="submit" class="btn-cadastrar">
                <i class="fa-solid fa-plus"></i> Cadastrar Usuário
            </button>
        </form>
    </div>

    <div class="lista-container">
        <div class="lista-header">
            <h3>Usuários Cadastrados</h3>
            <span id="contador" class="badge">0</span>
        </div>
        
        <!-- Substituímos a tabela por uma Grid de Cards -->
        <div id="listaUsuarios" class="grid-usuarios">
            <!-- Cards preenchidos via JavaScript -->
        </div>
    </div>

    <!-- Link para o seu JS -->
    <script src="src/js/script.js"></script>
</body>
</html>
